# Example: run codeintegrity on a Go repo (consumer workflow).
name: codeintegrity
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Install codeintegrity
        run: go install github.com/GreyAssoc/code-tester/cmd/codeintegrity@latest
      - name: Crawl (SARIF for code scanning)
        run: codeintegrity crawl --format sarif -o codeintegrity.sarif ./... || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codeintegrity.sarif
          category: codeintegrity
      - name: Gate on findings
        run: codeintegrity crawl --fail-on error ./...

  checks:
    runs-on: ubuntu-latest
    if: hashFiles('integrity/checks.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go install github.com/GreyAssoc/code-tester/cmd/codeintegrity@latest
      - run: codeintegrity check --request integrity/checks.json --format json -o checks-report.json ./...
